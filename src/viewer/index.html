<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#161914" />
    <title>STL Field Viewer</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #e8e8dc;
        --muted: #929789;
        --panel: rgba(22, 25, 20, 0.92);
        --line: #43493b;
        --signal: #e6ff4f;
        --danger: #ff765f;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #0d0f0c;
        color: var(--ink);
        font-family:
          'Avenir Next Condensed', 'DIN Alternate', 'Bahnschrift', sans-serif;
      }

      body::after {
        position: fixed;
        inset: 0;
        z-index: 2;
        background-image: repeating-linear-gradient(
          0deg,
          transparent 0,
          transparent 3px,
          rgba(255, 255, 255, 0.015) 4px
        );
        content: '';
        pointer-events: none;
      }

      #viewport {
        width: 100%;
        height: 100%;
        touch-action: none;
      }

      .console {
        position: fixed;
        top: clamp(12px, 3vw, 30px);
        left: clamp(12px, 3vw, 30px);
        z-index: 3;
        width: min(430px, calc(100vw - 24px));
        border: 1px solid var(--line);
        background: var(--panel);
        box-shadow: 10px 10px 0 rgba(0, 0, 0, 0.24);
        backdrop-filter: blur(12px);
        animation: arrive 420ms ease-out both;
      }

      .console::before {
        display: block;
        height: 4px;
        background: var(--signal);
        content: '';
      }

      header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        padding: 17px 18px 12px;
        border-bottom: 1px solid var(--line);
      }

      h1 {
        margin: 0;
        font-size: clamp(18px, 4vw, 25px);
        font-stretch: condensed;
        font-weight: 700;
        letter-spacing: 0.08em;
        line-height: 1;
        text-transform: uppercase;
      }

      .live {
        display: flex;
        align-items: center;
        gap: 7px;
        color: var(--muted);
        font-family: ui-monospace, monospace;
        font-size: 10px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .live::before {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--signal);
        box-shadow: 0 0 10px var(--signal);
        content: '';
      }

      .controls {
        padding: 15px 18px 17px;
      }

      label {
        display: block;
        margin-bottom: 7px;
        color: var(--muted);
        font-family: ui-monospace, monospace;
        font-size: 10px;
        letter-spacing: 0.15em;
        text-transform: uppercase;
      }

      select {
        width: 100%;
        min-height: 44px;
        padding: 0 38px 0 12px;
        border: 1px solid #5b6250;
        border-radius: 0;
        outline: none;
        background: #10120f;
        color: var(--ink);
        font: 14px ui-monospace, monospace;
      }

      select:focus {
        border-color: var(--signal);
      }

      .readout {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 7px 16px;
        margin: 16px 0 0;
        font-family: ui-monospace, monospace;
        font-size: 12px;
      }

      .readout dt {
        color: var(--muted);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .readout dd {
        margin: 0;
        overflow: hidden;
        text-align: right;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      #status[data-error='true'] {
        color: var(--danger);
      }

      .hint {
        position: fixed;
        right: clamp(12px, 3vw, 30px);
        bottom: clamp(12px, 3vw, 30px);
        z-index: 3;
        margin: 0;
        color: rgba(232, 232, 220, 0.55);
        font: 10px ui-monospace, monospace;
        letter-spacing: 0.08em;
        text-align: right;
        text-transform: uppercase;
      }

      @keyframes arrive {
        from {
          opacity: 0;
          transform: translateY(-10px);
        }
      }

      @media (max-width: 560px) {
        .console {
          box-shadow: 6px 6px 0 rgba(0, 0, 0, 0.24);
        }

        .hint {
          display: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .console {
          animation: none;
        }
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "/vendor/three.module.js"
        }
      }
    </script>
  </head>
  <body>
    <main id="viewport" aria-label="Interactive STL model view"></main>
    <section class="console" aria-label="Model controls">
      <header>
        <h1>STL Field Viewer</h1>
        <span class="live">Auto sync</span>
      </header>
      <div class="controls">
        <label for="model-select">Model / dist</label>
        <select id="model-select" aria-label="Select an STL model"></select>
        <dl class="readout">
          <dt>Dimensions</dt>
          <dd id="dimensions">—</dd>
          <dt>State</dt>
          <dd id="status">Scanning…</dd>
        </dl>
      </div>
    </section>
    <p class="hint">Drag · orbit / Pinch · zoom / Two-finger drag · pan</p>
    <script type="module" src="/main.js"></script>
  </body>
</html>
